apiVersion: v1
kind: ServiceAccount
metadata:
  name: hotel-operator
  namespace: central
  labels:
    app: hotel-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hotel-operator-role
rules:
  # Watch and manage Hotel CRDs
  - apiGroups: ["platform.devops.io"]
    resources: ["hotels", "rooms"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  
  # Manage namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "update", "patch"]
  
  # Manage ConfigMaps and Secrets
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  
  # Manage PersistentVolumeClaims
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  
  # Manage Services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  
  # Manage Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  
  # Read pods (for status checking)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hotel-operator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hotel-operator-role
subjects:
  - kind: ServiceAccount
    name: hotel-operator
    namespace: central
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-operator
  namespace: central
  labels:
    app: hotel-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-operator
  template:
    metadata:
      labels:
        app: hotel-operator
    spec:
      serviceAccountName: hotel-operator
      containers:
        - name: operator
          image: dkitdevops/hotel-operator:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: ENVIRONMENT
              value: "prod"
