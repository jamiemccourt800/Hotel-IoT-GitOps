apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |-
    [SERVICE]
        Parsers_File parsers.conf

    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Tag kube.*
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On

    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_URL https://kubernetes.default.svc:443
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude Off

    [FILTER]
        Name parser
        Match kube.var.log.containers.{(upload|videos|auth|view|comments)}-depl-*.log        
        Key_Name log
        Parser parser
        Reserve_Data On

    [OUTPUT]
        Name es
        Match kube.*
        Host quickstart-es-http.logging.svc.cluster.local
        Port 9200
        HTTP_User elastic
        HTTP_Passwd ${ELASTIC_PASSWORD}
        Index fluent-bit
        Suppress_Type_Name On
        Include_Tag_Key On

  parsers.conf: |-
    [PARSER]
        Name parser
        Format regex
        Regex ^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) - (?<service>[^ ]+) - (?<level>[A-Z]+) - (?<message>.*)$
        Time_Key time
        Time_Format %Y-%m-%d %H:%M:%S,%L
        Time_Keep On
