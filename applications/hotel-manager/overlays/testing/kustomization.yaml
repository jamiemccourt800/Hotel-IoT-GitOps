apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../deployment.yaml
  - ../../ingress.yaml

# Patches for testing environment
patches:
  # Update image pull policy for testing
  - target:
      kind: Deployment
      name: hotel-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "testing-secret-key-do-not-use-in-prod"

  # Update ingress for testing subdomain
  - target:
      kind: Ingress
      name: hotel-manager
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: hotel-manager.testing.local

# Add testing-specific labels
commonLabels:
  environment: testing
  app.kubernetes.io/part-of: hotel-platform

# Add testing annotations
commonAnnotations:
  deployed-by: argocd
  environment: testing
