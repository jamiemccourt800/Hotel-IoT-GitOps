apiVersion: v1
kind: ServiceAccount
metadata:
  name: hotel-manager
  namespace: default
  labels:
    app: hotel-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hotel-manager-role
rules:
  # Read and manage Hotel CRDs
  - apiGroups: ["platform.devops.io"]
    resources: ["hotels", "rooms"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Read namespaces and pods for status checking
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
  
  # Read ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hotel-manager-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hotel-manager-role
subjects:
  - kind: ServiceAccount
    name: hotel-manager
    namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-manager
  namespace: default
  labels:
    app: hotel-manager
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: hotel-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-manager
  namespace: default
  labels:
    app: hotel-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-manager
  template:
    metadata:
      labels:
        app: hotel-manager
    spec:
      serviceAccountName: hotel-manager
      containers:
        - name: hotel-manager
          image: dkitdevops/hotel-manager:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: SECRET_KEY
              value: "change-this-in-production"
            - name: PORT
              value: "5000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
