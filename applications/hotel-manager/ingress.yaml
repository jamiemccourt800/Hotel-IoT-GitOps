apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hotel-manager
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: hotel-manager.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hotel-manager
                port:
                  number: 80
