[[outputs.influxdb]]
  urls = ["http://victoria-metrics:8428"]
  database = "victoriametrics"
  skip_database_creation = true
  exclude_retention_policy_tag = true
  content_encoding = "gzip"

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics  = ["mqtt_messages"]
  consumer_group = "telegraf_group"
  max_message_len = 1000000
  offset = "oldest"
  data_format = "json_v2"
                    
  [[inputs.kafka_consumer.json_v2]]
    # The MQTT bridge sends { topic: ..., message: { measurement, tags, fields, timestamp } }
    measurement_name_path = "message.measurement"
    timestamp_path = "message.timestamp"
    timestamp_format = "unix_ms"

    [[inputs.kafka_consumer.json_v2.object]]
      path = "message.fields"

    [[inputs.kafka_consumer.json_v2.tag]]
      path = "message.tags.hotel_id"
      type = "string"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "message.tags.room"
      type = "int"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "message.tags.sensor"
      type = "string"

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics  = ["executed_actions"]
  consumer_group = "telegraf_actions_group"
  max_message_len = 1000000
  offset = "oldest"
  data_format = "json_v2"

  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "actions"
    timestamp_path = "timestamp"
    timestamp_format = "unix_ms"

    [[inputs.kafka_consumer.json_v2.object]]
      path = "body"

    [[inputs.kafka_consumer.json_v2.tag]]
      path = "site_id"
      type = "string"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "topic"
      type = "string"