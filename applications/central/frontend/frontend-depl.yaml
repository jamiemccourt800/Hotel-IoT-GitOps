apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  # replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: app-frontend
          imagePullPolicy: Always
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_COMMAND_SERVICE_URL
              value: "http://command:5000"
            - name: REACT_APP_HOTELID
              value: "hotel_01"
            - name: REACT_APP_ROOMID
              value: "101"