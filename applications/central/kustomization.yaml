apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - telegraf/telegraf.yaml
#  - victoria-metrics/kustomization.yaml
  - command/command-depl.yaml
  - command/command-svc.yaml

configMapGenerator:
  - name: telegraf-config
    files:
      - telegraf/telegraf.conf


generatorOptions:
  disableNameSuffixHash: true

