apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: central

resources:
  - telegraf/telegraf-helm.yaml\
  - victoria-metrics/victoria-metrics-helm.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: central-config
    literals:
      - DATABASE_URL=jdbc:postgresql://db:5432/central
      - API_VERSION=v1
  - name: telegraf-config
    files:
      - telegraf/telegraf.conf

images:
  - name: central-service
    newName: registry.example.com/central
    newTag: latest


