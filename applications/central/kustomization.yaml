apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: central

resources:
  - namespace-central.yaml
  - telegraf/telegraf.yaml
  - command/command-depl.yaml
  - command/command-svc.yaml
  - frontend/frontend-depl.yaml
  - frontend/frontend-svc.yaml
  - frontend/frontend-configmap.yml
  - kafka/kafka-nodepool.yaml
  - kafka/kraftbroker_controller.yaml
  - kafka/kafka-alias-svc.yaml
  - userdb/userdb-depl.yaml
  - userdb/userdb-svc.yaml
  - userdb/mongodb-secret.yml
  - grafana/grafana-depl.yaml
  - grafana/grafana-svc.yaml
  - grafana/grafana-dashboard-provider.yaml
  - grafana/grafana-ds.yaml
  - grafana/grafana-dashboards.yaml
  - booking_api/booking_api_depl.yml
  - booking_api/booking_api_svc.yml
#  - unleash/unleash-proxy-depl.yaml
#  - unleash/unleash-proxy-svc.yaml
  

#configMapGenerator:
#  - name: my-release-telegraf
#    namespace: central
#    files:
#      - telegraf/telegraf.conf

generatorOptions:
  disableNameSuffixHash: true


helmCharts:
  - name: telegraf
    repo: https://helm.influxdata.com/
    releaseName: my-release
    namespace: central
    valuesInline:
      agent:
        interval: "2s"
        round_interval: true
      extraVolumes:
        - name: telegraf-config
          configMap:
            name: my-release-telegraf
            optional: false
      extraVolumeMounts:
        - name: telegraf-config
          mountPath: /etc/telegraf/telegraf.conf
          subPath: telegraf.conf
          readOnly: true

  - name: victoria-metrics-cluster
    includeCRDs: true
    releaseName: vm
    version: 0.29.4
    repo: https://victoriametrics.github.io/helm-charts/
    namespace: central
    valuesInline:
      vmcluster:
      vmselect:
        replicaCount: 3
      vminsert:
        replicaCount: 3
      vmstorage:
        replicaCount: 3

  - name: strimzi-kafka-operator
    repo: https://strimzi.io/charts/
    releaseName: strimzi
    version: 0.46.0
    namespace: central
    valuesInline:
      watchAnyNamespace: false
      crds:
        install: true
  # Strimzi watches only the release namespace (central), avoiding duplicate RoleBindings.