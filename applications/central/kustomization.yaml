apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - telegraf/telegraf.yaml
#  - victoria-metrics/kustomization.yaml
  - command/command-depl.yaml
  - command/command-svc.yaml

configMapGenerator:
  - name: telegraf-config
    files:
      - telegraf/telegraf.conf


generatorOptions:
  disableNameSuffixHash: true


helmCharts:
  - name: telegraf
    repo: https://helm.influxdata.com/
    releaseName: my-release
    valuesInline:
      agent:
        interval: "2s"
        round_interval: true
      extraVolumes:
        - name: telegraf-config
          configMap:
            name: telegraf-config
      extraVolumeMounts:
        - name: telegraf-config
          mountPath: /etc/telegraf
          readOnly: true
  - name: victoria-metrics-cluster
    includeCRDs: true
    releaseName: vm
    version: 0.9.9
    repo: https://victoriametrics.github.io/helm-charts/
    valuesInline:
      vmselect:
        replicaCount: 3
      vminsert:
        replicaCount: 3
      vmstorage:
        replicaCount: 3


