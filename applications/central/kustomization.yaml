apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: central

resources:
  - telegraf/telegraf.yaml
  - command/command-depl.yaml
  - command/command-svc.yaml
  - frontend/frontend-depl.yaml
  - frontend/frontend-svc.yaml
  - kafka/kraftbroker_controller.yaml
  - pvc-grafana.yaml
  - pvc-mongodb.yaml
  - pvc-victoria-metrics.yaml
  - grafana/grafana-depl.yaml
  - grafana/grafana-svc.yaml
  - grafana/grafana-dashboard-provider.yaml
  - grafana/grafana-ds.yaml
  - grafana/grafana-dashboards.yaml

configMapGenerator:
  - name: telegraf-config
    files:
      - telegraf/telegraf.conf


generatorOptions:
  disableNameSuffixHash: true


helmCharts:
  - name: telegraf
    repo: https://helm.influxdata.com/
    releaseName: my-release
    valuesInline:
      agent:
        interval: "2s"
        round_interval: true
      extraVolumes:
        - name: telegraf-config
          configMap:
            name: telegraf-config
      extraVolumeMounts:
        - name: telegraf-config
          mountPath: /etc/telegraf
          readOnly: true
  - name: victoria-metrics-cluster
    includeCRDs: true
    releaseName: vm
    version: 0.29.4
    repo: https://victoriametrics.github.io/helm-charts/
    valuesInline:
      vmcluster:
      vmselect:
        replicaCount: 3
      vminsert:
        replicaCount: 3
      vmstorage:
        replicaCount: 3
  - name: confluent-for-kubernetes
    repo: https://packages.confluent.io/helm/
    includeCRDs: true
    releaseName: confluent-operator
    valuesInline:
      operator:
        enabled: true
