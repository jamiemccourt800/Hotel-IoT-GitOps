apiVersion: apps/v1
kind: Deployment
metadata:
  name: command
  labels:
    app: command
spec:
  replicas: 1
  selector:
    matchLabels:
      app: command
  template:
    metadata:
      labels:
        app: command
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: 
            - 'sh'
            - '-c'
            - |
              echo "Waiting for Kafka to be ready..."
              until nc -z kafka-kafka-bootstrap.central.svc.cluster.local 9092; do
                echo "Kafka not ready, waiting..."
                sleep 2
              done
              echo "Kafka is ready!"
      containers:
        - name: command
          image: command
          imagePullPolicy: Always
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: API_PORT
              value: "5000"
            - name: KAFKA_BOOTSTRAP
              value: "kafka.central.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "actuator"
            - name: CLIENT_ID
              value: "fastapi-producer"
            - name: ACKS
              value: "all"
            - name: RETRIES
              value: "10"
            - name: LINGER_MS
              value: "5"
            - name: VICTORIA_BASE_URL
              value: "http://vm-victoria-metrics-cluster-vmselect.central.svc.cluster.local:8481"
