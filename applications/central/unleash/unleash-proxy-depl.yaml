apiVersion: apps/v1
kind: Deployment
metadata:
  name: unleash-proxy
  labels:
    app: unleash-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unleash-proxy
  template:
    metadata:
      labels:
        app: unleash-proxy
    spec:
      containers:
        - name: unleash-proxy
          image: unleashorg/unleash-proxy
          ports:
            - containerPort: 3000
          env:
            - name: UNLEASH_URL
              value: "https://gitlab.comp.dkit.ie/api/v4/feature_flags/unleash/2212"
            - name: UNLEASH_INSTANCE_ID
              value: "glffct-X6fa8vgxkQcssohsCwqN"
            - name: UNLEASH_APP_NAME
              value: ""
            - name: UNLEASH_PROXY_SECRETS
              value: "1Password"
            - name: UNLEASH_API_TOKEN
              value: "not-used"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # Optional: always restart
          imagePullPolicy: Always
