apiVersion: v1
kind: ConfigMap
metadata:
  name: temperature-actuator-config
  labels:
    app: temperature-actuator
data:
  HOTEL_ID: "hotel_01"
  ROOM: "101"
  SENSOR: "temperature-actuator"
  MQTT_BROKER: "mosquitto.hotel.svc.cluster.local"
  MQTT_PORT: "1883"
  QOS: "1"
  KEEPALIVE: "60"
  DEFAULT_TARGET: "22.0"
  CONTROL_INTERVAL: "5.0"
  DEADBAND: "0.5"
  UNLEASH_APP_NAME: "actuator"
