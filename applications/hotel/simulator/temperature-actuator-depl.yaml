apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-actuator
  labels:
    app: temperature-actuator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperature-actuator
  template:
    metadata:
      labels:
        app: temperature-actuator
    spec:
      containers:
        - name: temperature-actuator
          image: dkitdevops/hotel-temperature-actuator:latest
          imagePullPolicy: Always
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: temperature-actuator-config
            - configMapRef:
                name: unleash-config
          env:
            - name: UNLEASH_INSTANCE_ID
              valueFrom:
                secretKeyRef:
                  name: unleash-secret
                  key: UNLEASH_INSTANCE_ID
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
