apiVersion: apps/v1
kind: Deployment
metadata:
  name: light-actuator
  labels:
    app: light-actuator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: light-actuator
  template:
    metadata:
      labels:
        app: light-actuator
    spec:
      containers:
        - name: light-actuator
          image: light-actuator:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: light-actuator-config
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
