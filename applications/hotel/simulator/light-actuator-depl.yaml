apiVersion: apps/v1
kind: Deployment
metadata:
  name: light-actuator
  labels:
    app: light-actuator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: light-actuator
  template:
    metadata:
      labels:
        app: light-actuator
    spec:
      containers:
        - name: light-actuator
          image: dkitdevops/hotel-light-actuator:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: light-actuator-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
