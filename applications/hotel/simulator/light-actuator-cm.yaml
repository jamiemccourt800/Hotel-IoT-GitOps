apiVersion: v1
kind: ConfigMap
metadata:
  name: light-actuator-config
  labels:
    app: light-actuator
data:
  HOTEL_ID: "hotel_01"
  ROOM: "101"
  SENSOR: "light-actuator"
  BROKER: "mosquitto.hotel.svc.cluster.local"
  BROKER_PORT: "1883"
  QOS: "1"
  KEEPALIVE: "60"
  INITIAL_ON: "true"
  INITIAL_BRIGHTNESS: "100"
