apiVersion: v1
kind: ConfigMap
metadata:
  name: light-actuator-config
  labels:
    app: light-actuator
data:
  HOTEL_ID: "hotel_01"
  ROOM: "101"
  SENSOR: "light-actuator"
  MQTT_BROKER: "mosquitto.hotel.svc.cluster.local"
  MQTT_PORT: "1883"
  QOS: "1"
  KEEPALIVE: "60"
  DEFAULT_BRIGHTNESS: "75.0"
  CONTROL_INTERVAL: "5.0"
  UNLEASH_APP_NAME: "actuator"
