apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-agent
  labels:
    app: alert-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-agent
  template:
    metadata:
      labels:
        app: alert-agent
    spec:
      containers:
        - name: alert-agent
          image: dkitdevops/hotel-alert-agent:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: alert-agent-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
