apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-agent
  labels:
    app: alert-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-agent
  template:
    metadata:
      labels:
        app: alert-agent
    spec:
      containers:
        - name: alert-agent
          image: dkitdevops/hotel-alert-agent:latest
          imagePullPolicy: Always
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - python
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - python
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: alert-agent-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
