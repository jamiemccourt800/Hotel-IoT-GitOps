apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-agent
  labels:
    app: alert-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alert-agent
  template:
    metadata:
      labels:
        app: alert-agent
    spec:
      containers:
        - name: alert-agent
          image: alert-agent:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: alert-agent-config
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
