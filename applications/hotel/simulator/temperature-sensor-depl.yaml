apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-sensor
  labels:
    app: temperature-sensor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temperature-sensor
  template:
    metadata:
      labels:
        app: temperature-sensor
    spec:
      containers:
        - name: temperature-sensor
          image: temperature-sensor:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: temperature-sensor-config
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
