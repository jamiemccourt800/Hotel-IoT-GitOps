apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-sensor
  labels:
    app: temperature-sensor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temperature-sensor
  template:
    metadata:
      labels:
        app: temperature-sensor
    spec:
      containers:
        - name: temperature-sensor
          image: dkitdevops/hotel-temperature-sensor:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: temperature-sensor-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
