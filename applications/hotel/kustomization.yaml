apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CRDs and namespace only - no hotel instances by default
# Hotels and rooms should be created using the CRDs via hotel-operator or hotel-manager

namespace: hotel

resources:
  - namespace.yaml
  
  # Platform Engineering CRDs for hotel and room scaling
  - hotel-crd.yaml
  - room-crd.yaml
