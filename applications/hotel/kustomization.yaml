apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hotel

resources:
  - Kafka-MQTT/kafka-mqtt-depl.yaml
  - Kafka-MQTT/kafka-mqtt-svc.yaml
  - MQTT/mosquitto-cm.yaml
  - MQTT/mosquitto-depl.yaml
  - MQTT/mosquitto-svc.yaml
  - MQTT-Kafka/mqtt-kafka-depl.yaml
  - MQTT-Kafka/mqtt-kafka-svc.yaml

helmCharts:
  - name: confluent-for-kubernetes
    repo: https://packages.confluent.io/helm
    releaseName: confluent-operator
    namespace: central
