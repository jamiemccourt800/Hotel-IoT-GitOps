apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-agent-config
  labels:
    app: alert-agent
data:
  MQTT_BROKER: "mosquitto.hotel.svc.cluster.local"
  MQTT_PORT: "1883"
  MQTT_SUB: "hotel_01/#"
  MQTT_PUB: "alerts"
  HOTEL_ID: "hotel_01"
  ROOM: "101"
  SENSOR: "alert-agent"
  QOS: "1"
  KEEPALIVE: "60"
  TEMP_HIGH_C: "30"
  TEMP_LOW_C: "15.0"
  HUMIDITY_HIGH_PCT: "70.0"
  HUMIDITY_LOW_PCT: "30.0"
  LIGHT_HIGH_PCT: "100.0"
  LIGHT_LOW_PCT: "0.0"
  OFFLINE_TIMEOUT_S: "120"
  DEDUP_WINDOW_S: "60"
