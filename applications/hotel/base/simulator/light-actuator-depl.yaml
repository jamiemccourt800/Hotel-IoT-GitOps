apiVersion: apps/v1
kind: Deployment
metadata:
  name: light-actuator
  labels:
    app: light-actuator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: light-actuator
  template:
    metadata:
      labels:
        app: light-actuator
    spec:
      containers:
        - name: light-actuator
          image: dkitdevops/hotel-light-actuator:latest
          imagePullPolicy: Always
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: light-actuator-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
