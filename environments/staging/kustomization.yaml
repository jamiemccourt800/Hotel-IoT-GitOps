apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Add prefix to all resources to avoid collision with other environments
namePrefix: staging-

resources:
  - ./../../applications/central
  - ./../../applications/hotel
  - ./gateway.yaml
  - ./gateway-service.yaml
  - ./gateway-config.yaml
  - ./gateway-ingress.yaml

# Patch PVCs to use K3s local-path storage class
patches:
  - target:
      kind: Namespace
      name: staging-hotel-prod
    patch: |-
      - op: replace
        path: /metadata/name
        value: hotel-staging
  - target:
      kind: Namespace
      name: staging-central-prod
    patch: |-
      - op: replace
        path: /metadata/name
        value: central-staging
  # Update ENVIRONMENT env var for operators
  - target:
      kind: Deployment
      name: staging-hotel-operator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: staging
  # Fix ClusterRoleBinding subjects to use correct ServiceAccount names
  - target:
      kind: ClusterRoleBinding
      name: staging-hotel-operator-binding
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: staging-hotel-operator
      - op: replace
        path: /subjects/0/namespace
        value: central-staging
  - target:
      kind: ClusterRoleBinding
      name: staging-hotel-manager-binding
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: staging-hotel-manager
      - op: replace
        path: /subjects/0/namespace
        value: central-staging
  - target:
      kind: ClusterRoleBinding
      name: staging-strimzi-cluster-operator
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: staging-strimzi-cluster-operator
      - op: replace
        path: /subjects/0/namespace
        value: central-staging
  - target:
      kind: ClusterRoleBinding
      name: staging-vm-victoria-metrics-cluster-clusterrolebinding
    patch: |-
      - op: replace
        path: /roleRef/name
        value: staging-vm-victoria-metrics-cluster-clusterrole
      - op: replace
        path: /subjects/0/name
        value: staging-vm-victoria-metrics-cluster
      - op: replace
        path: /subjects/0/namespace
        value: central-staging
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path

images:
  - name: command
    newName: dkitdevops/central-command
    newTag: latest

  - name: app-frontend
    newName: dkitdevops/app-frontend
    newTag: latest

  - name: hotel-kafka-to-mqtt
    newName: dkitdevops/hotel-kafka-to-mqtt
    newTag: latest

  - name: hotel-mqtt-to-kafka
    newName: dkitdevops/hotel-mqtt-to-kafka
    newTag: latest

  - name: temperature-sensor
    newName: dkitdevops/hotel-temperature-sensor
    newTag: latest

  - name: light-actuator
    newName: dkitdevops/hotel-light-actuator
    newTag: latest

  - name: alert-agent
    newName: dkitdevops/hotel-alert-agent
    newTag: latest
  
  - name: booking-api
    newName: dkitdevops/booking_api
    newTag: latest
