apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

helmCharts:
  - name: argocd-image-updater
    repo: https://argoproj.github.io/argo-helm
    version: 0.9.1
    releaseName: argocd-image-updater
    namespace: argocd
    valuesInline:
      config:
        argocd:
          serverAddr: argocd-server.argocd.svc.cluster.local:443
          insecure: true
          plaintext: false
