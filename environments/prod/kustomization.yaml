apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./../../applications/central
  - ./../../applications/hotel
  - ./gateway/gateway.yaml
  - ./gateway/gateway-service.yaml
  - ./gateway/gateway-config.yaml
  - ./data/pvc-victoria-metrics.yaml
  - ./data/pvc-grafana.yaml
  - ./data/pvc-mosquitto.yaml
  - ./data/pvc-mongodb.yaml
  - ./image-updater

patches:
  - path: grafana-env-patch.yml
    target:
      kind: Deployment
      name: grafana
  - path: telegraf-cm.yaml
    target:
      kind: ConfigMap
      name: my-release-telegraf

images:
  - name: command
    newName: dkitdevops/central-command
    newTag: latest

  - name: app-frontend
    newName: dkitdevops/central-app-frontend
    newTag: latest

  - name: hotel-kafka-to-mqtt
    newName: dkitdevops/hotel-kafka-to-mqtt
    newTag: stable

  - name: hotel-mqtt-to-kafka
    newName: dkitdevops/hotel-mqtt-to-kafka
    newTag: stable

  - name: temperature-sensor
    newName: dkitdevops/hotel-temperature-sensor
    newTag: latest

  - name: light-actuator
    newName: dkitdevops/hotel-light-actuator
    newTag: latest

  - name: alert-agent
    newName: dkitdevops/hotel-alert-agent
    newTag: latest
  
  - name: booking-api
    newName: dkitdevops/booking_api
    newTag: v1.0
