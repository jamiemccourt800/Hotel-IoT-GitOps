apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: central
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: "prod.127.0.0.1.nip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /command
            pathType: Prefix
            backend:
              service:
                name: command
                port:
                  number: 5000
          - path: /booking-api
            pathType: Prefix
            backend:
              service:
                name: booking-api-service
                port:
                  number: 3003
