apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: azuredisk
  csi:
    driver: disk.csi.azure.com
    volumeHandle: aksshare
    readOnly: false
    nodeStageSecretRef:
      name: azure-storage-secret
      namespace: central
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: central
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azuredisk
  resources:
    requests:
      storage: 10Gi