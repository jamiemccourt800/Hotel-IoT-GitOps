apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: central
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: gateway.conf
      volumes:
        - name: config
          configMap:
            name: api-gateway-config
