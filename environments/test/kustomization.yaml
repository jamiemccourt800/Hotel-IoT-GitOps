apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Add prefix to all resources to avoid collision with other environments
namePrefix: test-

resources:
  - ./../../applications/central
  - ./../../applications/hotel
  - ./../../operators/hotel-operator
  - ./../../applications/hotel-manager
  - ./backend-ingress.yaml
  - ./frontend-ingress.yaml

patches:
  - path: grafana-env-patch.yml
    target:
      kind: Deployment
      name: test-grafana
  - target:
      kind: Namespace
      name: test-hotel-prod
    patch: |-
      - op: replace
        path: /metadata/name
        value: hotel-test
  - target:
      kind: Namespace
      name: test-central-prod
    patch: |-
      - op: replace
        path: /metadata/name
        value: central-test
  # Update ENVIRONMENT env var for operators
  - target:
      kind: Deployment
      name: test-hotel-operator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: test
  # Override namespace from central to central-test for hotel-operator and hotel-manager resources
  - target:
      kind: ServiceAccount
      name: test-hotel-operator
      namespace: central
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: central-test
  - target:
      kind: ServiceAccount
      name: test-hotel-manager
      namespace: central
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: central-test
  - target:
      kind: Deployment
      name: test-hotel-operator
      namespace: central
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: central-test
  - target:
      kind: Deployment
      name: test-hotel-manager
      namespace: central
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: central-test
  - target:
      kind: Service
      name: test-hotel-manager
      namespace: central
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: central-test
  - target:
      kind: Ingress
      name: test-hotel-manager
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: central-test
  # Fix ClusterRoleBinding subjects to use correct ServiceAccount names
  - target:
      kind: ClusterRoleBinding
      name: test-hotel-operator-binding
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: test-hotel-operator
      - op: replace
        path: /subjects/0/namespace
        value: central-test
  - target:
      kind: ClusterRoleBinding
      name: test-hotel-manager-binding
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: test-hotel-manager
      - op: replace
        path: /subjects/0/namespace
        value: central-test
  - target:
      kind: ServiceAccount
      name: test-strimzi-cluster-operator
      namespace: central
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: central-test
  - target:
      kind: Deployment
      name: test-strimzi-cluster-operator
      namespace: central
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: central-test
  - target:
      kind: RoleBinding
      name: test-strimzi-cluster-operator-leader-election
      namespace: central
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: central-test
      - op: replace
        path: /subjects/0/namespace
        value: central-test
  - target:
      kind: ClusterRoleBinding
      name: test-strimzi-cluster-operator
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: test-strimzi-cluster-operator
      - op: replace
        path: /subjects/0/namespace
        value: central-test
  - target:
      kind: ClusterRoleBinding
      name: test-vm-victoria-metrics-cluster-clusterrolebinding
    patch: |-
      - op: replace
        path: /roleRef/name
        value: test-vm-victoria-metrics-cluster-clusterrole
      - op: replace
        path: /subjects/0/name
        value: test-vm-victoria-metrics-cluster
      - op: replace
        path: /subjects/0/namespace
        value: central-test
images:
  - name: command
    newName: dkitdevops/central-command
    newTag: latest

  - name: app-frontend
    newName: dkitdevops/app-frontend
    newTag: v1.1

  - name: hotel-kafka-to-mqtt
    newName: dkitdevops/hotel-kafka-to-mqtt
    newTag: stable

  - name: hotel-mqtt-to-kafka
    newName: dkitdevops/hotel-mqtt-to-kafka
    newTag: stable

  - name: temperature-sensor
    newName: dkitdevops/hotel-temperature-sensor
    newTag: latest

  - name: light-actuator
    newName: dkitdevops/hotel-light-actuator
    newTag: latest

  - name: alert-agent
    newName: dkitdevops/hotel-alert-agent
    newTag: latest
  
  - name: booking-api
    newName: dkitdevops/booking_api
    newTag: v1.0
  
  - name: dkitdevops/hotel-operator
    newTag: latest

  - name: dkitdevops/hotel-manager
    newTag: latest
  