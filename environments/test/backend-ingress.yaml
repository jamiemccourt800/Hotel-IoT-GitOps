apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: central-test
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - http:
        paths:
          - path: /api/booking(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: test-booking-api-service
                port:
                  number: 8000
          - path: /api/command(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: test-command
                port:
                  number: 5000
