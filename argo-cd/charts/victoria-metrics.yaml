apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-cluster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-metrics-cluster
    targetRevision: 0.9.9
    helm:
      releaseName: vm
      values: |
        vmselect:
          replicaCount: 3
        vminsert:
          replicaCount: 3
        vmstorage:
          replicaCount: 3
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Replace: true is useful for managing CRDs that can't be updated
      - Replace=true
