apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.comp.dkit.ie/D00271292/devops-project-gitops.git
    targetRevision: main
    path: infrastructure/crds
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
